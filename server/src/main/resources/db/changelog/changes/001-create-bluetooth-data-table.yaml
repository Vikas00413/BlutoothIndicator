databaseChangeLog:
  - changeSet:
      id: 001-create-bluetooth-data-table
      author: bluetooth-device
      changes:
        - createTable:
            tableName: bluetooth_data
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    nullable: false
              - column:
                  name: created_at
                  type: TIMESTAMPTZ
                  defaultValueComputed: CURRENT_TIMESTAMP
                  constraints:
                    nullable: false
              - column:
                  name: ssid
                  type: VARCHAR(255)
                  constraints:
                    nullable: false
              - column:
                  name: ble_name
                  type: VARCHAR(255)
                  constraints:
                    nullable: true
              - column:
                  name: connection_status
                  type: VARCHAR(50)
                  constraints:
                    nullable: false
              - column:
                  name: last_seen_time
                  type: BIGINT
                  constraints:
                    nullable: false
